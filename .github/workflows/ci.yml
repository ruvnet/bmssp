name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: ./scripts/build-npm.sh
      - name: Pack
        working-directory: npm
        run: npm pack
      - name: Fresh install of the tarball, run README quickstart and checks
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          cp npm/examples/*.mjs "$T"/
          cd "$T"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/npm/ruvnet-bmssp-*.tgz
          node quickstart.mjs | tee out.txt
          grep -qx '\[ 0, 1, 3.5, 4.5 \]' out.txt
          node check.mjs
