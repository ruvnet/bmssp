[package]
name = "bmssp-rust"
version = "0.1.0"
edition = "2021"
authors = ["BMSSP Development Team"]
description = "Bidirectional Multi-Source Shortest Path algorithm implementation"
license = "MIT"
keywords = ["graph", "shortest-path", "algorithm"]
categories = ["algorithms", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
getrandom = { version = "0.2", features = ["js"] }
num-traits = "0.2.19"
rayon = { version = "1.8", optional = true }
atomic = "0.6"
once_cell = "1.19"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.0"
once_cell = "1.0"
tokio-test = "0.4"

[features]
default = ["rayon-parallel"]
rayon-parallel = ["rayon"]
simd = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned: 0.2.100 reproduces the 1.0.0 TypeScript surface (no Symbol.dispose, which needs lib esnext).
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
web-sys = "0.3"


[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
